<title>Cave Bedroom 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #15110e;
    --panel: rgba(27, 21, 17, 0.82);
    --panel-solid: #1d1713;
    --ink: #efe6da;
    --muted: #a89a8b;
    --line: rgba(239, 230, 218, 0.14);
    --ember: #e0a263;
    --ember-ink: #1a120b;
    --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .top {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(21,17,14,0.85), rgba(21,17,14,0));
    padding-bottom: 18px;
  }
  .titlebar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .title h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.7rem;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .title p {
    margin: 4px 0 0;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .seg {
    pointer-events: auto;
    display: inline-flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }
  .seg button {
    font: 600 0.78rem/1 var(--font-ui);
    color: var(--muted);
    background: none;
    border: 0;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--ember); color: var(--ember-ink); }
  .chips {
    pointer-events: auto;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    margin: 0 -16px;
    padding: 0 16px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    font: 600 0.8rem/1 var(--font-ui);
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .chip.active { border-color: var(--ember); color: var(--ember); }

  .bottom {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
  }
  .stick {
    pointer-events: auto;
    width: 112px; height: 112px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--line);
    position: relative;
    touch-action: none;
    flex-shrink: 0;
  }
  .stick::after {
    content: "WALK";
    position: absolute;
    left: 50%; top: -18px;
    transform: translateX(-50%);
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  .knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 46px; height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    background: var(--ember);
    box-shadow: 0 0 18px rgba(224, 162, 99, 0.45);
  }
  .actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: auto; }
  .action {
    font: 600 0.8rem/1 var(--font-ui);
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .action .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .action[aria-pressed="true"] .dot { background: var(--ember); box-shadow: 0 0 8px var(--ember); }
  button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 140px);
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 0.78rem;
    padding: 9px 14px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .hint.gone { opacity: 0; }
  .loading {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: var(--muted);
    background: var(--ground);
  }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<div id="stage"></div>
<div class="loading" id="loading">Building the room…</div>

<header class="top">
  <div class="titlebar">
    <div class="title">
      <h1>Cave Bedroom</h1>
      <p>≈ 3.8 × 6.0 m · 2.7 m ceiling · estimated from your video</p>
    </div>
    <div class="seg" role="group" aria-label="Camera mode">
      <button id="modeWalk" aria-pressed="true">Walk</button>
      <button id="modeHouse" aria-pressed="false">Dollhouse</button>
    </div>
  </div>
  <nav class="chips" aria-label="Viewpoints">
    <button class="chip active" data-view="door">Doorway</button>
    <button class="chip" data-view="bed">Sitting on bed</button>
    <button class="chip" data-view="sofa">On the sofa</button>
    <button class="chip" data-view="wall">Bed wall</button>
    <button class="chip" data-view="rail">Clothes rail</button>
    <button class="chip" data-view="top">From above</button>
  </nav>
</header>

<div class="bottom">
  <div class="stick" id="stick" aria-label="Walk joystick"><div class="knob" id="knob"></div></div>
  <div class="actions">
    <button class="action" id="bathBtn" aria-pressed="true"><span class="dot"></span><span id="bathLabel">Bathroom curtain: closed</span></button>
    <button class="action" id="lightBtn" aria-pressed="true"><span class="dot"></span><span id="lightLabel">Evening lights</span></button>
  </div>
</div>
<div class="hint" id="hint">Drag to look around · joystick to walk</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const W = 3.8, L = 6.0, H = 2.7;
  const stage = document.getElementById('stage');

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x15110e);
  const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 60);
  // layout is authored in local room coords; root mirrors x so the bed is on the right seen from the door
  const root = new THREE.Group();
  root.scale.x = -1;
  root.position.x = W;
  scene.add(root);

  /* ---------- procedural textures ---------- */
  function canvasTex(w, h, draw, repeatX, repeatY) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    if (repeatX) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeatX, repeatY); }
    return t;
  }
  let seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function noise(g, w, h, n, a) {
    for (let i = 0; i < n; i++) {
      const v = Math.floor(rnd() * 255);
      g.fillStyle = `rgba(${v},${v},${v},${a})`;
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
    }
  }

  const floorTex = canvasTex(1024, 1024, (g, w, h) => {
    const rows = 8, rh = h / rows;
    for (let r = 0; r < rows; r++) {
      let x = -rnd() * 400;
      while (x < w) {
        const len = 380 + rnd() * 420;
        const base = [58 + rnd() * 22, 38 + rnd() * 14, 24 + rnd() * 8];
        g.fillStyle = `rgb(${base[0]|0},${base[1]|0},${base[2]|0})`;
        g.fillRect(x, r * rh, len, rh);
        for (let k = 0; k < 26; k++) {
          const y = r * rh + rnd() * rh;
          g.strokeStyle = `rgba(20,12,6,${0.08 + rnd() * 0.18})`;
          g.lineWidth = 1 + rnd() * 2;
          g.beginPath(); g.moveTo(x, y);
          g.bezierCurveTo(x + len * 0.3, y + (rnd() - 0.5) * 8, x + len * 0.6, y + (rnd() - 0.5) * 8, x + len, y);
          g.stroke();
        }
        g.fillStyle = 'rgba(12,7,4,0.9)';
        g.fillRect(x, r * rh, 2, rh);
        x += len;
      }
      g.fillStyle = 'rgba(12,7,4,0.85)';
      g.fillRect(0, r * rh, w, 2);
    }
  }, 2.2, 3.4);

  const plasterTex = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#2b2927'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 140; i++) {
      const x = rnd() * w, y = rnd() * h, r = 20 + rnd() * 70;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      const v = rnd() < 0.5 ? '255,245,230' : '0,0,0';
      grd.addColorStop(0, `rgba(${v},0.05)`); grd.addColorStop(1, `rgba(${v},0)`);
      g.fillStyle = grd; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    noise(g, w, h, 9000, 0.05);
  }, 3, 1.5);

  const stoneTex = canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = '#1f1f1e'; g.fillRect(0, 0, w, h);
    let y = 0;
    while (y < h) {
      const rh = 40 + rnd() * 50; let x = -rnd() * 80;
      while (x < w) {
        const rw = 90 + rnd() * 160, v = 44 + rnd() * 26;
        g.fillStyle = `rgb(${v|0},${(v - 1)|0},${(v - 3)|0})`;
        g.fillRect(x + 2, y + 2, rw - 4, rh - 4);
        for (let k = 0; k < 6; k++) {
          g.fillStyle = `rgba(0,0,0,${0.08 + rnd() * 0.15})`;
          g.fillRect(x + rnd() * rw, y + rnd() * rh, 10 + rnd() * 50, 2 + rnd() * 6);
          g.fillStyle = `rgba(255,240,220,${0.03 + rnd() * 0.05})`;
          g.fillRect(x + rnd() * rw, y + rnd() * rh, 10 + rnd() * 40, 2 + rnd() * 4);
        }
        x += rw;
      }
      y += rh;
    }
    noise(g, w, h, 16000, 0.07);
  }, 2.4, 1.3);

  const rugTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#2a2826'; g.fillRect(0, 0, w, h); noise(g, w, h, 12000, 0.12);
  }, 3, 3);

  function paintingTex(kind) {
    return canvasTex(320, 400, (g, w, h) => {
      const sky = g.createLinearGradient(0, 0, 0, h);
      if (kind === 0) { sky.addColorStop(0, '#3b4148'); sky.addColorStop(1, '#141619'); }
      else if (kind === 1) { sky.addColorStop(0, '#6d5b48'); sky.addColorStop(1, '#2b221b'); }
      else { sky.addColorStop(0, '#50443a'); sky.addColorStop(1, '#1b1714'); }
      g.fillStyle = sky; g.fillRect(0, 0, w, h);
      const layers = kind === 0 ? ['#565d66', '#3a4048', '#23272c', '#15171a'] : ['#8a7258', '#5e4a39', '#3a2d23', '#221a14'];
      layers.forEach((col, i) => {
        g.fillStyle = col; g.beginPath();
        const base = h * (0.38 + i * 0.14); g.moveTo(0, h);
        for (let x = 0; x <= w; x += 16) g.lineTo(x, base - Math.abs(Math.sin(x * 0.02 + i * 2)) * (70 - i * 12) - rnd() * 10);
        g.lineTo(w, h); g.fill();
      });
      if (kind === 0) { g.fillStyle = 'rgba(230,225,215,0.18)'; g.fillRect(0, h * 0.34, w, 18); }
    });
  }

  const screenTex = canvasTex(512, 288, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, w, h);
    grd.addColorStop(0, '#0e1a26'); grd.addColorStop(0.55, '#2d3b44'); grd.addColorStop(1, '#6a4a30');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,0.55)';
    g.beginPath(); g.moveTo(0, h); g.lineTo(w * 0.3, h * 0.55); g.lineTo(w * 0.5, h * 0.72); g.lineTo(w * 0.75, h * 0.45); g.lineTo(w, h * 0.7); g.lineTo(w, h); g.fill();
  });

  /* ---------- materials ---------- */
  const M = {
    floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55, metalness: 0.05 }),
    wall: new THREE.MeshStandardMaterial({ map: plasterTex, roughness: 0.95 }),
    stone: new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.9 }),
    ceiling: new THREE.MeshStandardMaterial({ color: 0x6f6961, roughness: 1 }),
    walnut: new THREE.MeshStandardMaterial({ color: 0x4a2e1c, roughness: 0.6 }),
    walnutLight: new THREE.MeshStandardMaterial({ color: 0x5e3b24, roughness: 0.6 }),
    black: new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.45, metalness: 0.6 }),
    leather: new THREE.MeshStandardMaterial({ color: 0x7a4424, roughness: 0.5 }),
    leatherDark: new THREE.MeshStandardMaterial({ color: 0x5a3119, roughness: 0.55 }),
    bedding: new THREE.MeshStandardMaterial({ color: 0x26292c, roughness: 1 }),
    pillow: new THREE.MeshStandardMaterial({ color: 0x44474a, roughness: 1 }),
    fur: new THREE.MeshStandardMaterial({ color: 0x6a5039, roughness: 1 }),
    curtain: new THREE.MeshStandardMaterial({ color: 0x3a261a, roughness: 0.95, side: THREE.DoubleSide }),
    rug: new THREE.MeshStandardMaterial({ map: rugTex, roughness: 1 }),
    door: new THREE.MeshStandardMaterial({ color: 0x2a2522, roughness: 0.7 }),
    glass: new THREE.MeshStandardMaterial({ color: 0xcfd9d6, roughness: 0.3, transparent: true, opacity: 0.38, side: THREE.DoubleSide }),
    tile: new THREE.MeshStandardMaterial({ color: 0xd9d7d2, roughness: 0.4 }),
    white: new THREE.MeshStandardMaterial({ color: 0xeeeeea, roughness: 0.3 }),
    linen: new THREE.MeshStandardMaterial({ color: 0xd8c7ad, roughness: 1, side: THREE.DoubleSide, emissive: 0xffc98a, emissiveIntensity: 0.55 }),
    drum: new THREE.MeshStandardMaterial({ color: 0x3b332c, roughness: 1, side: THREE.DoubleSide }),
    glow: new THREE.MeshBasicMaterial({ color: 0xffd9a8 }),
    screen: new THREE.MeshBasicMaterial({ map: screenTex }),
    windowGlow: new THREE.MeshBasicMaterial({ color: 0x7d8a96 }),
    plant: new THREE.MeshStandardMaterial({ color: 0x2f4a2a, roughness: 0.8 }),
    clothes: [0x2b2b2d, 0x4a4036, 0x1f2328, 0x5a4a3c, 0x3a3a3a, 0x2e3a33].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 1 })),
    brass: new THREE.MeshStandardMaterial({ color: 0xa27a45, roughness: 0.35, metalness: 0.8 }),
  };

  /* ---------- helpers ---------- */
  function box(w, h, d, mat, x, y, z, parent) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    (parent || root).add(m);
    return m;
  }
  // box from min/max bounds
  function bb(x0, x1, y0, y1, z0, z1, mat, parent) {
    return box(x1 - x0, y1 - y0, z1 - z0, mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2, parent);
  }
  function cyl(r0, r1, h, mat, x, y, z, parent, seg) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg || 20), mat);
    m.position.set(x, y, z);
    (parent || root).add(m);
    return m;
  }
  function rod(a, b, r, mat, parent) {
    const dir = new THREE.Vector3().subVectors(b, a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dir.length(), 10), mat);
    m.position.copy(a).addScaledVector(dir, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    (parent || root).add(m);
    return m;
  }
  function plane(w, h, mat, parent) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    (parent || root).add(m);
    return m;
  }
  function pleated(w, h, folds) {
    const g = new THREE.PlaneGeometry(w, h, Math.max(24, Math.round(w * 40)), 1);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i);
      p.setZ(i, Math.sin((x / w) * folds * Math.PI * 2) * 0.035);
    }
    g.computeVertexNormals();
    return g;
  }

  /* ---------- groups hidden in dollhouse view ---------- */
  const G = {
    left: new THREE.Group(), right: new THREE.Group(),
    entry: new THREE.Group(), window: new THREE.Group(), ceiling: new THREE.Group(),
  };
  Object.values(G).forEach(g => root.add(g));
  const wallInfo = [
    { g: G.left, test: p => p.x < 0 },
    { g: G.right, test: p => p.x > W },
    { g: G.entry, test: p => p.z < 0 },
    { g: G.window, test: p => p.z > L },
    { g: G.ceiling, test: p => p.y > H },
  ];

  /* ---------- shell ---------- */
  const floor = plane(W, L, M.floor); floor.rotation.x = -Math.PI / 2; floor.position.set(W / 2, 0, L / 2);
  const ceil = plane(W, L, M.ceiling, G.ceiling); ceil.rotation.x = Math.PI / 2; ceil.position.set(W / 2, H, L / 2);

  const wl = plane(L, H, M.wall, G.left); wl.rotation.y = Math.PI / 2; wl.position.set(0, H / 2, L / 2);
  const wr = plane(L, H, M.stone, G.right); wr.rotation.y = -Math.PI / 2; wr.position.set(W, H / 2, L / 2);
  const we = plane(W, H, M.wall, G.entry); we.position.set(W / 2, H / 2, 0);
  const ww = plane(W, H, M.wall, G.window); ww.rotation.y = Math.PI; ww.position.set(W / 2, H / 2, L);

  // skirting
  bb(0, 0.015, 0, 0.08, 0, L, M.walnut, G.left);
  bb(W - 0.015, W, 0, 0.08, 0, L, M.walnut, G.right);
  bb(0, W, 0, 0.08, 0, 0.015, M.walnut, G.entry);
  bb(0, W, 0, 0.08, L - 0.015, L, M.walnut, G.window);

  /* ---------- window + curtains (far wall) ---------- */
  const winX = W / 2 - 0.2;
  const win = plane(1.0, 1.1, M.windowGlow, G.window); win.rotation.y = Math.PI; win.position.set(winX, 1.75, L - 0.012);
  bb(winX - 0.54, winX + 0.54, 1.16, 1.2, L - 0.06, L, M.black, G.window);
  bb(winX - 0.54, winX + 0.54, 2.3, 2.34, L - 0.06, L, M.black, G.window);
  bb(winX - 0.54, winX - 0.5, 1.16, 2.34, L - 0.06, L, M.black, G.window);
  bb(winX + 0.5, winX + 0.54, 1.16, 2.34, L - 0.06, L, M.black, G.window);
  bb(winX - 0.5, winX + 0.5, 1.74, 1.77, L - 0.05, L, M.black, G.window);
  bb(winX - 1.3, winX + 1.3, H - 0.03, H, L - 0.16, L - 0.1, M.black, G.window);
  [-1, 1].forEach(s => {
    const c = new THREE.Mesh(pleated(0.95, H - 0.04, 5), M.curtain);
    c.rotation.y = Math.PI;
    c.position.set(winX + s * 0.8, (H - 0.04) / 2, L - 0.13);
    G.window.add(c);
  });

  /* ---------- entry door + hooks + robe ---------- */
  bb(0.3, 1.2, 0, 2.1, 0, 0.04, M.door, G.entry);
  bb(0.26, 1.24, 2.1, 2.16, 0, 0.03, M.walnut, G.entry);
  cyl(0.012, 0.012, 0.14, M.black, 1.08, 1.02, 0.07, G.entry).rotation.z = Math.PI / 2;
  [1.42, 1.56, 1.7].forEach(x => { bb(x - 0.012, x + 0.012, 1.72, 1.78, 0, 0.07, M.black, G.entry); });
  bb(1.34, 1.64, 1.02, 1.72, 0.05, 0.12, M.clothes[0], G.entry);

  /* ---------- bathroom glass box + curtain ---------- */
  const bx = W - 1.8, bz = 1.8;
  const tileFloor = plane(1.8, 1.8, M.tile); tileFloor.rotation.x = -Math.PI / 2; tileFloor.position.set(bx + 0.9, 0.005, 0.9);
  const g1 = plane(1.8, H - 0.02, M.glass); g1.position.set(bx + 0.9, (H - 0.02) / 2, bz);
  const g2 = plane(bz, H - 0.02, M.glass); g2.rotation.y = Math.PI / 2; g2.position.set(bx, (H - 0.02) / 2, bz / 2);
  // glass door frame + hinges on the room-facing side
  bb(bx - 0.012, bx + 0.012, 0, 2.05, 0.95, 0.97, M.brass);
  bb(bx - 0.012, bx + 0.012, 0, 2.05, 1.7, 1.72, M.brass);

  function applyCamera() {
    if (mode === 'walk') {
      camera.fov = 70;
      camera.position.set(W - walk.x, walk.y, walk.z);

        orbit.ty + orbit.r * Math.cos(orbit.phi),
        orbit.tz + orbit.r * sp * Math.cos(orbit.theta));

  const pointers = new Map();

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  canvas.addEventListener('pointermove', e => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    prev.x = e.clientX; prev.y = e.clientY;
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (mode === 'house' && pinchDist) orbit.r = Math.min(16, Math.max(3, orbit.r * pinchDist / d));
      pinchDist = d;
      return;

    hideHint();
    if (mode === 'walk') {
      walk.yaw -= dx * 0.005;
      walk.pitch = Math.max(-1.2, Math.min(1.2, walk.pitch + dy * 0.004));
    } else {
      orbit.theta -= dx * 0.006;
      orbit.phi = Math.max(0.05, Math.min(1.45, orbit.phi - dy * 0.005));
    }
  });

  /* ---------- joystick + keys ---------- */

  function stickUpdate(e) {
    const r = stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const max = r.width / 2 - 20, len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    move.x = dx / max; move.y = -dy / max;
  }
  stick.addEventListener('pointerdown', e => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickUpdate(e); hideHint(); e.stopPropagation(); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickUpdate(e); });
  function stickEnd(e) { if (e.pointerId !== stickId) return; stickId = null; move.x = move.y = 0; knob.style.transform = ''; }

  /* ---------- loop ---------- */
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
  }
  window.addEventListener('resize', resize);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (mode === 'walk') {
      let fx = move.y, sx = move.x;
      if (keys.has('w') || keys.has('arrowup')) fx += 1;
      if (keys.has('s') || keys.has('arrowdown')) fx -= 1;
      if (keys.has('a') || keys.has('arrowleft')) sx -= 1;
      if (keys.has('d') || keys.has('arrowright')) sx += 1;
      if (fx || sx) {
        const sp = 1.4 * dt;
        const fwx = Math.sin(walk.yaw), fwz = Math.cos(walk.yaw);
        const rx = fwz, rz = -fwx;
        const nx = walk.x + (fwx * fx + rx * sx) * sp;
        const nz = walk.z + (fwz * fx + rz * sx) * sp;
        const inside = blocked(walk.x, walk.z);
        if (inside || !blocked(nx, walk.z)) walk.x = nx;
        if (inside || !blocked(walk.x, nz)) walk.z = nz;
        if (!inside && walk.y < 1.5) walk.y = Math.min(1.6, walk.y + dt * 1.5);
        walk.x = Math.max(R, Math.min(W - R, walk.x));
        walk.z = Math.max(R, Math.min(L - R, walk.z));
      }
    }
    applyCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  setBath(true);
  setLights(true);
  setMode('walk');
  resize();
  document.getElementById('loading').hidden = true;
  if (location.hash === '#top') goView('top');
  requestAnimationFrame(frame);
})();
