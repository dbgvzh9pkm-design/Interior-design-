<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0472f"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#b0472f"/></marker></defs>
<style>
.t{font-size:32px;font-weight:700;fill:#1c1f20}.h{font-size:21px;font-weight:700;fill:#1c1f20}.l{font-size:17px;fill:#4d5350}
.d{stroke:#b0472f;stroke-width:2.5;fill:none}.g{stroke:#b0472f;stroke-width:1.2;stroke-dasharray:4 4;fill:none}
.dt{font-size:22px;font-weight:700;fill:#b0472f;paint-order:stroke;stroke:#fbfaf7;stroke-width:5px}
.tag{font-size:18px;font-weight:700;fill:#b0472f;paint-order:stroke;stroke:#fbfaf7;stroke-width:5px}
.ld{stroke:#b0472f;stroke-width:1.5;fill:none}
</style>
<text x="40" y="60" class="t">Pipe clothes rail: build sheet</text>
<text x="40" y="92" class="l">All sizes in cm, measured from the floor. Black iron pipe 3/4" (27 mm), walnut shelf.</text>

<image href="file:///home/user/Interior-design-/designs/banana_20260927T175139_732179Z_rail-front.jpg" x="120" y="130" width="928" height="1152"/>
<!-- left dims -->
<path class="g" d="M322 340 H80 M365 453 H40 M365 1198 H40"/>
<path class="d" d="M90 340 V1198" marker-start="url(#a)" marker-end="url(#a)"/><text x="82" y="770" class="dt" text-anchor="middle" transform="rotate(-90 82 770)">shelf top 180</text>
<path class="d" d="M50 453 V1198" marker-start="url(#a)" marker-end="url(#a)"/><text x="42" y="900" class="dt" text-anchor="middle" transform="rotate(-90 42 900)">hanging bar 160</text>
