<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1380" width="960" height="1380" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="1380" fill="#fbfaf7"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0472f"/>
    </marker>
    <pattern id="wall" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#3a3c3d"/><line x1="0" y1="0" x2="0" y2="8" stroke="#55585a" stroke-width="3"/>
    </pattern>
  </defs>
  <style>
    .t{font-size:30px;font-weight:700;fill:#1c1f20}
    .h{font-size:22px;font-weight:700;fill:#1c1f20}
    .l{font-size:18px;fill:#5d6360}
    .d{stroke:#b0472f;stroke-width:2.5;fill:none}
    .dt{font-size:26px;font-weight:700;fill:#b0472f}
    .s{fill:#e7c9ad;stroke:#7a4e2e;stroke-width:3}
    .arm{fill:#c89a73;stroke:#7a4e2e;stroke-width:2}
    .c{fill:#f1dcc6;stroke:#7a4e2e;stroke-width:1.5}
    .g{stroke:#b9bdb9;stroke-width:1.5;stroke-dasharray:6 6;fill:none}
  </style>

  <text x="40" y="56" class="t">The L-sofa in your pictures: sizes to buy</text>
  <text x="40" y="88" class="l">Sized to fit your real window wall (302 cm). Scale drawing, cm, outside edges incl. arms.</text>

  <!-- ===== TOP VIEW: scale 2.4 px/cm. Left wall x=90, right wall x=815, window wall y=200 ===== -->
  <text x="40" y="140" class="h">1 · SEEN FROM ABOVE</text>

  <!-- walls -->
  <rect x="78" y="188" width="749" height="12" fill="url(#wall)"/>
  <rect x="78" y="188" width="12" height="760" fill="url(#wall)"/>
  <rect x="815" y="188" width="12" height="760" fill="url(#wall)"/>
  <!-- window -->
  <rect x="390" y="186" width="240" height="16" fill="#cfe0e3" stroke="#6d8f96" stroke-width="2"/>
  <text x="510" y="176" class="l" text-anchor="middle">window</text>
  <!-- curtain track -->
  <line x1="170" y1="229" x2="770" y2="229" stroke="#7a4e2e" stroke-width="3" stroke-dasharray="3 5"/>
  <text x="650" y="222" class="l" font-size="15">curtain track</text>
  <text x="848" y="760" class="l" transform="rotate(90 848 760)">RIGHT WALL</text>
  <text x="62" y="620" class="l" transform="rotate(-90 62 620)">LEFT WALL (TV side)</text>

  <!-- sofa: back 15 cm off wall => y=236; main depth 90 => y 236..452 ; main x 215..815 (250 cm) ; chaise x 599..815 (90), y 236..620 (160) -->
  <path class="s" d="M215 236 H815 V620 H599 V452 H215 Z"/>
  <rect x="215" y="236" width="600" height="46" class="arm"/>       <!-- backrest along window -->
  <rect x="215" y="282" width="38" height="170" class="arm"/>       <!-- left arm -->
  <rect x="775" y="282" width="40" height="338" class="arm"/>       <!-- right arm / chaise back -->
  <rect x="257" y="286" width="170" height="162" rx="10" class="c"/>
  <rect x="431" y="286" width="164" height="162" rx="10" class="c"/>
  <rect x="603" y="286" width="168" height="162" rx="10" class="c"/>
  <rect x="603" y="452" width="168" height="164" rx="10" class="c"/>
  <text x="628" y="540" class="h" fill="#7a4e2e">CHAISE</text>
  <text x="628" y="566" class="l">(legs up)</text>
  <text x="470" y="266" class="l" fill="#3a2a1d">backrest</text>

  <!-- floor lamp corner -->
  <circle cx="150" cy="290" r="30" fill="#f4ecd9" stroke="#9a8a70" stroke-width="2"/>
  <text x="150" y="340" class="l" text-anchor="middle" font-size="15">floor lamp</text>

  <!-- coffee table -->
  <rect x="350" y="500" width="190" height="96" rx="4" fill="#d9c2a8" stroke="#7a4e2e" stroke-width="1.5"/>
  <text x="445" y="554" class="l" text-anchor="middle" font-size="15">coffee table</text>

  <!-- bed (headboard on right wall) -->
  <rect x="323" y="726" width="492" height="222" fill="#dfe1df" stroke="#9aa09b" stroke-width="2"/>
  <rect x="797" y="726" width="18" height="222" fill="#8a5a3b"/>
  <text x="520" y="840" class="l">bed (headboard on right wall)</text>

  <!-- DIMENSIONS -->
  <!-- 250 main length -->
  <path class="g" d="M215 452 V660"/>
  <path class="d" d="M215 650 H599" marker-start="url(#a)"/>
  <path class="d" d="M599 650 H815" marker-end="url(#a)"/>
  <rect x="330" y="636" width="160" height="30" fill="#fbfaf7"/>
  <text x="410" y="660" class="dt" text-anchor="middle">250 long</text>

  <!-- 90 depth (main) -->
  <path class="d" d="M200 236 V452" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="190" y="420" class="dt" text-anchor="end">90</text>
  <text x="190" y="444" class="l" text-anchor="end">deep</text>

  <!-- 160 chaise length -->
  <path class="g" d="M815 620 H890 M827 236 H890"/>
  <path class="d" d="M882 236 V620" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="894" y="420" class="dt">160</text>

  <!-- 90 chaise width -->
  <path class="d" d="M599 700 H815" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="680" y="686" width="54" height="28" fill="#fbfaf7"/>
  <text x="707" y="710" class="dt" text-anchor="middle">90</text>

  <!-- 44 chaise to bed -->
  <path class="d" d="M570 620 V726" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="560" y="684" class="dt" text-anchor="end">≈44</text>

  <!-- 15 off wall -->
  <path class="d" d="M240 200 V236" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="250" y="224" class="l" font-size="16" font-weight="700" fill="#b0472f">15</text>

  <!-- 52 lamp corner -->
  <path class="d" d="M90 600 H215" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="152" y="590" class="dt" text-anchor="middle" font-size="22">52</text>

  <text x="40" y="1000" class="l">Standing at the door looking at it, the chaise is on the RIGHT: in shops look for a</text>
  <text x="40" y="1024" class="l">"right-hand facing (RAF) chaise sectional". Overall: 250 × 160 cm.</text>

  <!-- ===== SIDE VIEW ===== scale 2.4 px/cm floor y=1290 -->
  <text x="40" y="1080" class="h">2 · SEEN FROM THE SIDE</text>
  <line x1="200" y1="1290" x2="640" y2="1290" stroke="#1c1f20" stroke-width="2"/>
  <rect x="270" y="1276" width="10" height="14" fill="#3a2a1d"/>
  <rect x="464" y="1276" width="10" height="14" fill="#3a2a1d"/>
  <path class="s" d="M260 1276 V1182 H432 V1276 Z"/>
  <path class="s" d="M432 1276 V1098 Q433 1096 438 1096 H472 Q476 1096 476 1101 V1276 Z"/>
  <path d="M260 1276 H476" stroke="#7a4e2e" stroke-width="3"/>
  <text x="300" y="1236" class="l">seat</text>
  <path class="g" d="M476 1098 H600 M476 1290 H600"/>
  <path class="d" d="M590 1098 V1290" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="602" y="1188" class="dt">≈80</text>
  <text x="602" y="1212" class="l">back height, stays below</text>
  <text x="602" y="1234" class="l">the window sill (≈110)</text>
  <path class="g" d="M260 1182 H200"/>
  <path class="d" d="M214 1182 V1290" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="202" y="1240" class="dt" text-anchor="end">≈45</text>
  <text x="202" y="1264" class="l" text-anchor="end">seat</text>
  <path class="d" d="M260 1322 H476" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="368" y="1360" class="dt" text-anchor="middle" font-size="22">90 deep</text>
</svg>
