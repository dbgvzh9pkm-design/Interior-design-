<g class="l"><text x="760" y="1100"><tspan class="b">Overall</tspan> 196 wide × 215 long</text>
<text x="760" y="1130"><tspan class="b">Posts</tspan> 4 × oak, 12 × 12</text>
<text x="760" y="1160"><tspan class="b">Headboard</tspan> 120 high, 5 wide</text>
<text x="760" y="1184">rough planks + 2 iron straps</text>
