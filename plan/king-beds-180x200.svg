<text x="760" y="1244"><tspan class="b">Side rails</tspan> beams 25 deep</text>
<text x="760" y="1284">+ most cave / lodge feel</text>
<text x="760" y="1310">+ toughest for guests</text>
<text x="760" y="1336">+ can be built (like the</text>
<text x="760" y="1360">   bed build guide)</text>
