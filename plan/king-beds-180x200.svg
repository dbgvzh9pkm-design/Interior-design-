</g>
<text x="760" y="160" class="h">1 · Cognac leather</text>
<g class="l"><text x="760" y="200"><tspan class="b">Overall</tspan> 190 wide × 212 long</text>
<text x="760" y="230"><tspan class="b">Headboard</tspan> 190 × 130 high,</text>
<text x="760" y="254">9 vertical channels</text>
<text x="760" y="284"><tspan class="b">Frame</tspan> upholstered, 30 high</text>
<text x="760" y="314"><tspan class="b">Legs</tspan> walnut, 8 high</text>
