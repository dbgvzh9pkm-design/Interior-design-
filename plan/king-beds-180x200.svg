<text x="760" y="384">+ matches the sofa</text>
<text x="760" y="410">− a lot of cognac next to it</text>
<text x="760" y="436">− leather can scratch</text>
<text x="760" y="476" class="b">Search: "king channel-tufted</text>
<text x="760" y="500" class="b">leather bed cognac 180x200"</text></g>

<g transform="translate(30,1020)">
